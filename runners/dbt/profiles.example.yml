# Copy this profile into ~/.dbt/profiles.yml and set the three environment variables
# DATABRICKS_HOST, DATABRICKS_HTTP_PATH and DATABRICKS_TOKEN before running dbt.
validation_sweep:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: validation_sweep
      schema: dbt
      threads: 4